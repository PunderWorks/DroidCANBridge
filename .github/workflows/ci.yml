name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Which parts of the repo did this change touch? ────────────────────────
  # PRs only run the jobs relevant to what they change. Pushes to main always
  # run everything. Editing this workflow counts as every area. Firmware jobs
  # join here once src/ exists.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      pcb: ${{ github.event_name != 'pull_request' || steps.filter.outputs.pcb == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pcb:
              - 'PCB/**'
              - 'ci/**'
              - 'manifest.kdl'
              - '.github/workflows/ci.yml'

  # ── Stackup hardware design ───────────────────────────────────────────────
  # The electrical design is PCB/stackup/board.kdl (Stackup KDL), not KiCad
  # schematics. This checks it with the Cargo-locked Stackup CLI (ci/stackup,
  # pinned with the parts library in manifest.kdl), then fails if syncing the
  # committed PCB from the design would change it, so the KDL and
  # PCB/DroidCANBridge.kicad_pcb can't drift apart. The sync check applies
  # the Stackup KiCad plugin to the board in memory with KiCad 10's Python and
  # never saves.
  stackup:
    name: Stackup Design + PCB Sync
    needs: changes
    if: needs.changes.outputs.pcb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Checkout Stackup KiCad plugin
        uses: actions/checkout@v7
        with:
          repository: stackup-eda/stackup
          ref: v0.3.0
          path: stackup-tool

      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Check Stackup design
        run: cargo +1.96.0 run --locked --manifest-path ci/stackup/Cargo.toml -- check PCB/stackup/board.kdl --locked

      # Only what the sync check needs: pcbnew and its Python module (`kicad`) and the stock
      # footprints (`kicad-footprints`, in case the plugin has to load one). `--install-recommends`
      # also pulled in the 3D models (280 MB), demos and docs: 581 MB, mostly from Launchpad's PPA
      # at about 0.5 MB/s, and the 3D-model download timed out every few runs. A missing 3D model
      # is reported by the sync, not counted as a change. Retries ride out a dropped connection;
      # the timeout stops a hung download from holding the job for hours.
      #
      # The downloaded .debs are cached, so a run only fetches the package indexes and anything
      # newer than the cache; the Ubuntu mirrors and the PPA are both slow at times. The key
      # changes with the runner image (roughly weekly) or this file, which picks up KiCad point
      # releases; a new key restores the previous cache, and autoclean drops superseded .debs
      # before the new one is saved.
      # ImageOS/ImageVersion are runner environment variables, not in the `env` context.
      - name: Read runner image
        id: image
        run: |
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore KiCad package cache
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: kicad-debs-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: kicad-debs-${{ steps.image.outputs.os }}-

      - name: Install KiCad 10
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-cache/partial
          APT_CACHE="-o Dir::Cache::archives=$HOME/apt-cache"
          sudo add-apt-repository --yes --no-update ppa:kicad/kicad-10.0-releases
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 $APT_CACHE \
            kicad kicad-footprints
          sudo apt-get autoclean $APT_CACHE
          sudo chown -R "$USER" ~/apt-cache

      - name: Check PCB sync
        run: |
          /usr/bin/python3 ci/check_pcb_sync.py PCB/DroidCANBridge.kicad_pcb \
            --stackup ci/stackup/target/debug/droidcanbridge-stackup-check \
            --plugin-dir stackup-tool/kicad-plugin

  # ── Single required check ─────────────────────────────────────────────────
  # The one status check to require on main. Jobs above may be skipped when a
  # PR doesn't touch their area; this job always runs and fails if any job
  # failed or was cancelled (skipped counts as passing). Add every new job to
  # `needs` or it won't gate merges.
  ci-result:
    name: CI Result
    if: always()
    needs: [changes, stackup]
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
